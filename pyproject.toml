[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musiccaps-multimodal"
version = "0.1.0"
description = "BERT, graph, multimodal fusion, and contrastive MusicCaps experiments"
requires-python = ">=3.11,<3.15"
dependencies = [
  "librosa>=0.10.2",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "soundfile>=0.12",
  "torch>=2.2",
  "torch-geometric>=2.5",
  "tqdm>=4.66",
  "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
